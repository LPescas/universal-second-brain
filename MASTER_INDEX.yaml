rules:
  global:
  - "# \U0001F504 MUDANÇA DE COMPORTAMENTO ABSOLUTA (Atualização Segura do AG Kit)\n\
    \nSempre que houver a necessidade de atualizar a infraestrutura da pasta `.agents`,\
    \ regras, habilidades ou fluxos do repositório remoto (AG Kit - vudovn/ag-kit),\
    \ você **DEVE OBRIGATORIAMENTE**:\n\n1. Utilizar EXCLUSIVAMENTE o comando de atualização\
    \ segura do AG Kit:\n   `ag-kit update`\n2. **NUNCA** sobrescrever os arquivos\
    \ manualmente de forma que apague as personalizações do usuário, pois o `ag-kit\
    \ update` faz o merge preservando os arquivos do usuário modificados localmente.\n\
    3. Se precisar visualizar o plano de atualização antes: `ag-kit update --dry-run`.\n\
    4. Caso dê algo errado, utilizar `ag-kit rollback` para retornar ao backup pré-atualização\
    \ mais recente.\n5. Em novos projetos, inicialize sempre com `ag-kit init`. Não\
    \ adicione `.agents/` ao `.gitignore` se o Antigravity precisar indexar as regras.\
    \ Use `.git/info/exclude` se precisar mantê-lo fora do versionamento público sem\
    \ perder a descoberta.\n\n**Justificativa:** O usuário exigiu que a atualização\
    \ dos recursos ligados à pasta `.agents` utilize o motor nativo do AG Kit para\
    \ mesclar atualizações sem destruir as regras customizadas, scripts e outras customizações\
    \ colocadas por ele próprio.\n"
